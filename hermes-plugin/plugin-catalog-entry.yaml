# Submission entry for the Hermes plugin catalog.
#
# Place this file at `plugin-catalog/soloknuckle.yaml` in a PR to the
# hermes-agent repository. Fill `sha` with the full 40-character commit that
# should be reviewed:
#
#     git rev-parse HEAD
#
# Admission is a human-merged gate: owner or major-contributor submissions only,
# exact SHA pins, no self-updating code, and `capabilities` must match what
# register() actually does at the pinned commit.
name: soloknuckle
title: Soloknuckle
repo: https://github.com/z99wE/soloknucklefXrhermes
sha: "REPLACE_WITH_REVIEWED_COMMIT"
version: "5.2.0"
description: >-
  Deterministic local guardrails for Hermes and dev workflows. Three invocable
  tools—git-diff secret scanning, a destructive-command firewall, and a project
  health score—plus native Hermes surfaces: additive credential-redaction
  patterns, a soloknuckle:hygiene skill, hermes hygiene CLI, /hygiene, and a
  weekly hygiene-report blueprint. One rule set, same verdicts across
  CLI/hooks/MCP/Hermes. No hooks, no middleware, no prompt rewriting, no
  telemetry.
maintainer: Soloknuckle Contributors
tier: community
category: tools
docs_url: https://github.com/z99wE/soloknucklefXrhermes/blob/main/HERMES-INTEGRATION.md
requires_hermes: ">=0.22.0"
readme: true
platforms: []
capabilities:
  provides_tools:
    - soloknuckle_secrets
    - soloknuckle_intercept
    - soloknuckle_health
  provides_hooks: []
  provides_middleware: []
  requires_env: []
